<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob: http://localhost:* http://127.0.0.1:*; media-src 'self' blob: http://localhost:* http://127.0.0.1:*; connect-src http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>FrameMind AI</title>
<!--
  FrameMind AI — standalone frontend (Milestone 09).
  One self-contained file: open it by double-clicking. No build step, no CDN, no external files.
  Offline it lets you load videos, match moments and extract frames in the browser.
  Real AI analysis, saved sessions and Codex settings need the local FastAPI backend (see README.md).
  UI text and icons are copied from frontend/src (i18n dictionaries, Icon.tsx); keep them in sync when those change.
-->
<style>
:root {
  --background: #10101e;
  --surface: #19192c;
  --surface-raised: #212137;
  --border: #37334f;
  --foreground: #f5f3ff;
  --muted: #9994b5;
  --primary: #7c3aed;
  --accent: #3b82f6;
  --primary-soft: #a78bfa;
  --ok: #34d399; --ok-text: #6ee7b7; --ok-soft: #a7f3d0;
  --err: #fb7185; --err-text: #fda4af; --err-soft: #fecdd3;
  --warn: #fbbf24; --warn-text: #fde68a; --warn-soft: #fef3c7;
  --sky: #38bdf8; --sky-soft: #bae6fd;
  --orange: #fb923c; --orange-soft: #fed7aa;
  --critical: #f43f5e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--background);
  color: var(--foreground);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; }
a { color: var(--primary-soft); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--primary-soft); outline-offset: 2px; }
svg { flex-shrink: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

/* ---------- Layout ---------- */
.shell { display: flex; min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; width: 256px; flex-shrink: 0; border-right: 1px solid rgba(55,51,79,.7); background: rgba(25,25,44,.6); }
.sidebar-inner { display: flex; flex-direction: column; gap: 32px; height: 100%; overflow-y: auto; padding: 24px 16px; }
.content { display: flex; flex-direction: column; flex: 1; min-width: 0; }
main { display: flex; flex-direction: column; gap: 24px; width: 100%; max-width: 1400px; margin: 0 auto; padding: 32px; }
.topbar { display: none; position: sticky; top: 0; z-index: 30; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid rgba(55,51,79,.7); background: rgba(16,16,30,.85); backdrop-filter: blur(8px); }
.drawer { position: fixed; inset: 0; z-index: 40; }
.drawer-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); }
.drawer-panel { position: absolute; inset: 0 auto 0 0; width: 288px; max-width: 85vw; background: var(--surface); border-right: 1px solid var(--border); box-shadow: 0 25px 50px rgba(0,0,0,.5); }
@media (max-width: 1023px) {
  .sidebar { display: none; }
  .topbar { display: flex; }
  main { padding: 24px 16px; }
}
.logo { display: flex; align-items: center; gap: 12px; color: var(--foreground); text-decoration: none !important; }
.logo-mark { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; box-shadow: 0 10px 15px rgba(124,58,237,.3); }
.logo-text { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.grad-text { background-image: linear-gradient(135deg, var(--primary-soft), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; color: var(--muted); font-weight: 500; text-decoration: none; transition: background .2s, color .2s; }
.nav a:hover { background: var(--surface-raised); color: var(--foreground); }
.nav a.active { background: rgba(124,58,237,.15); color: var(--foreground); }
.nav a.active svg { color: var(--primary-soft); }
.nav a.active::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 9999px; background: linear-gradient(135deg, var(--primary), var(--accent)); }
.side-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 16px; }
.side-note { border-radius: 16px; border: 1px solid rgba(167,139,250,.25); background: rgba(124,58,237,.1); padding: 16px; }
.side-note.offline { border-color: rgba(251,113,133,.3); background: rgba(251,113,133,.08); }

/* ---------- Generic ---------- */
.row { display: flex; align-items: center; gap: 8px; }
.wrap { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; }
.between { justify-content: space-between; }
.gap4 { gap: 4px; } .gap6 { gap: 6px; } .gap12 { gap: 12px; } .gap16 { gap: 16px; } .gap20 { gap: 20px; } .gap24 { gap: 24px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.fg { color: var(--foreground); }
.soft { color: var(--primary-soft); }
.accent { color: var(--accent); }
.ok { color: var(--ok-text); } .err { color: var(--err-soft); } .warn { color: var(--warn-text); }
.xs { font-size: 12px; } .xxs { font-size: 11px; } .tiny { font-size: 10px; }
.sm { font-size: 14px; } .base { font-size: 16px; }
.b { font-weight: 600; } .m { font-weight: 500; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.center { text-align: center; }
.pre { white-space: pre-line; }
.hidden { display: none !important; }
.grid2 { display: grid; gap: 24px; grid-template-columns: 1fr; }
@media (min-width: 1280px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.grid-sm2 { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .grid-sm2 { grid-template-columns: 1fr 1fr; } }
.grid3 { display: grid; gap: 8px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .grid3 { grid-template-columns: repeat(3, 1fr); } }
.grid4 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .grid4 { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1280px) { .grid4 { grid-template-columns: repeat(4, 1fr); } }

.page-header { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; justify-content: space-between; }
.page-header h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
.page-header p { margin: 6px 0 0; max-width: 42rem; color: var(--muted); font-size: 16px; }
@media (max-width: 640px) { .page-header h1 { font-size: 24px; } .page-header p { font-size: 14px; } }

.card { border-radius: 16px; border: 1px solid rgba(55,51,79,.7); background: var(--surface); box-shadow: 0 8px 30px rgba(0,0,0,.25); min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 20px 16px; }
.card-h h2 { margin: 0; font-size: 16px; font-weight: 600; }
.card-h p { margin: 4px 0 0; color: var(--muted); }
.card-b { padding: 0 20px 20px; }
.pad { padding: 20px; }
.box { border-radius: 12px; border: 1px solid rgba(55,51,79,.7); background: rgba(16,16,30,.5); padding: 12px; }
.dashed { border-radius: 12px; border: 1px dashed var(--border); padding: 20px 16px; text-align: center; color: var(--muted); font-size: 12px; }
.hr { border-top: 1px solid rgba(55,51,79,.6); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 12px; font-weight: 500; font-size: 14px; transition: all .2s; white-space: nowrap; }
.btn:disabled { opacity: .4; }
.btn-sm { height: 32px; padding: 0 12px; font-size: 12px; }
.btn-lg { height: 48px; width: 100%; font-size: 16px; }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; box-shadow: 0 10px 15px rgba(124,58,237,.25); }
.btn-primary:not(:disabled):hover { filter: brightness(1.1); box-shadow: 0 10px 15px rgba(124,58,237,.4); }
.btn-secondary { border: 1px solid var(--border); background: var(--surface-raised); color: var(--foreground); }
.btn-secondary:not(:disabled):hover { border-color: rgba(167,139,250,.5); }
.btn-ghost { color: var(--muted); }
.btn-ghost:not(:disabled):hover { background: var(--surface-raised); color: var(--foreground); }
.btn-toggled { border-color: rgba(167,139,250,.6) !important; background: rgba(124,58,237,.2) !important; color: var(--foreground); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; color: var(--muted); transition: all .2s; }
.icon-btn:not(:disabled):hover { background: var(--surface-raised); color: var(--foreground); }
.icon-btn.danger:not(:disabled):hover { background: rgba(251,113,133,.1); color: var(--err-text); }
.icon-btn:disabled { opacity: .4; }
.play-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 9999px; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; box-shadow: 0 4px 6px rgba(124,58,237,.3); transition: transform .2s; }
.play-btn:not(:disabled):hover { transform: scale(1.05); }
.play-btn:disabled { opacity: .4; }
.tag { border-radius: 6px; background: rgba(255,255,255,.2); padding: 2px 6px; font-size: 10px; font-weight: 600; letter-spacing: .03em; }
.link-btn { color: inherit; font-weight: 500; text-underline-offset: 2px; }
.link-btn:hover { text-decoration: underline; }

.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 9999px; border: 1px solid var(--border); background: var(--surface-raised); color: var(--muted); padding: 2px 10px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.b-primary { border-color: rgba(167,139,250,.4); background: rgba(124,58,237,.15); color: var(--primary-soft); }
.b-ok { border-color: rgba(52,211,153,.3); background: rgba(52,211,153,.1); color: var(--ok-soft); }
.b-err { border-color: rgba(251,113,133,.3); background: rgba(251,113,133,.1); color: var(--err-soft); }
.b-warn { border-color: rgba(251,191,36,.3); background: rgba(251,191,36,.1); color: var(--warn-text); }
.b-accent { border-color: rgba(59,130,246,.4); background: rgba(59,130,246,.1); color: var(--sky-soft); }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 9999px; flex-shrink: 0; }
.dot8 { width: 8px; height: 8px; }
.pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 9999px; border: 1px solid var(--border); background: var(--surface); padding: 6px 12px; font-size: 12px; font-weight: 500; color: var(--muted); }

.input { height: 40px; width: 100%; min-width: 0; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); padding: 0 12px; color: var(--foreground); }
.input:focus, .select:focus { border-color: var(--primary-soft); outline: none; }
.input:disabled, .select:disabled { opacity: .4; }
.input.sm { height: 32px; font-size: 13px; padding: 0 8px; }
.input.lg { height: 40px; font-size: 18px; margin-top: 8px; }
.input.invalid { border-color: rgba(251,113,133,.7); }
.input::placeholder { color: rgba(153,148,181,.6); }
.select { height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--background); padding: 0 6px; font-size: 12px; color: var(--foreground); }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }

.notice { display: flex; align-items: flex-start; gap: 8px; border-radius: 12px; padding: 10px 14px; font-size: 12px; line-height: 1.6; border: 1px solid; }
.n-info { border-color: rgba(167,139,250,.25); background: rgba(124,58,237,.1); color: var(--primary-soft); }
.n-warn { border-color: rgba(251,191,36,.3); background: rgba(251,191,36,.1); color: var(--warn-soft); }
.n-err { border-color: rgba(251,113,133,.3); background: rgba(251,113,133,.1); color: var(--err-soft); }
.n-ok { border-color: rgba(52,211,153,.25); background: rgba(52,211,153,.05); color: var(--ok-soft); }
.spin { display: inline-block; width: 14px; height: 14px; border-radius: 9999px; border: 2px solid rgba(167,139,250,.3); border-top-color: var(--primary-soft); animation: spin 1s linear infinite; flex-shrink: 0; }
.spin.white { border-color: rgba(255,255,255,.3); border-top-color: #fff; }
.spin.lg { width: 32px; height: 32px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .4; } }
.pulse { animation: pulse 2s ease-in-out infinite; }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
.empty-icon { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; margin-bottom: 16px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface-raised); color: var(--primary-soft); }
.empty p { margin: 0; }
.empty .t { font-weight: 500; }
.empty .d { margin-top: 4px; max-width: 24rem; color: var(--muted); }

/* ---------- Video ---------- */
.vpanel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 12px; }
.vicon { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: var(--surface-raised); flex-shrink: 0; }
.vbox { position: relative; aspect-ratio: 16/9; overflow: hidden; border-radius: 12px; border: 1px solid var(--border); background: #000; }
.vbox video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
.vbox-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0 24px; text-align: center; background: rgba(0,0,0,.75); }
.vbox-tag { position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 8px; max-width: 85%; border-radius: 8px; border: 1px solid rgba(255,255,255,.1); background: rgba(0,0,0,.7); padding: 6px 10px; font-size: 12px; color: #fff; pointer-events: none; }
.dropzone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; aspect-ratio: 16/9; width: 100%; padding: 0 16px; border-radius: 12px; border: 1px dashed var(--border); background: rgba(16,16,30,.6); text-align: center; cursor: pointer; transition: all .2s; }
.dropzone:hover { border-color: rgba(167,139,250,.6); background: var(--background); }
.dropzone.drag { border-color: var(--primary-soft); background: rgba(124,58,237,.1); }
.dropzone.error { border-color: rgba(251,113,133,.6); background: rgba(251,113,133,.05); }
.dz-icon { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; margin-bottom: 4px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); }
.dz-choose { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); padding: 6px 12px; font-size: 12px; color: var(--muted); }
.progress { height: 4px; overflow: hidden; border-radius: 9999px; background: var(--surface-raised); }
.progress > div { height: 100%; border-radius: 9999px; background: linear-gradient(135deg, var(--primary), var(--accent)); transition: width .3s; }

.vtl { position: relative; padding-top: 20px; }
.vtl-markers { position: absolute; left: 0; right: 0; top: 0; height: 20px; pointer-events: none; }
.vtl-marker { position: absolute; top: 0; display: flex; align-items: center; justify-content: center; height: 16px; min-width: 16px; padding: 0 4px; transform: translateX(-50%); border-radius: 4px; background: var(--surface-raised); color: var(--muted); box-shadow: 0 0 0 1px var(--border); font: 600 9px ui-monospace, Menlo, monospace; pointer-events: auto; }
.vtl-marker.sel { z-index: 10; background: var(--foreground); color: var(--background); transform: translateX(-50%) scale(1.1); }
.vtl-track { position: relative; display: flex; align-items: center; height: 20px; border-radius: 9999px; cursor: pointer; touch-action: none; }
.vtl-track.disabled { cursor: not-allowed; opacity: .4; }
.vtl-bar { position: relative; height: 6px; width: 100%; overflow: hidden; border-radius: 9999px; background: var(--border); }
.vtl-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 9999px; }
.vtl-tick { position: absolute; top: 50%; width: 2px; height: 12px; transform: translate(-50%, -50%); border-radius: 9999px; background: rgba(245,243,255,.4); pointer-events: none; }
.vtl-tick.sel { background: var(--foreground); }
.vtl-head { position: absolute; top: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%); border-radius: 9999px; background: var(--foreground); box-shadow: 0 0 0 3px rgba(124,58,237,.45); pointer-events: none; }
.vtl-band { position: absolute; top: 50%; height: 16px; transform: translateY(-50%); border-radius: 6px; pointer-events: none; min-width: 2px; }
.vtl-point { position: absolute; top: 50%; width: 4px; height: 20px; transform: translate(-50%, -50%); border-radius: 9999px; pointer-events: none; }
.ref-band { background: rgba(124,58,237,.35); box-shadow: 0 0 0 1px rgba(167,139,250,.7); }
.cur-band { background: rgba(59,130,246,.3); box-shadow: 0 0 0 1px rgba(59,130,246,.7); }
.ref-point { background: var(--primary-soft); box-shadow: 0 0 8px rgba(167,139,250,.8); }
.cur-point { background: var(--accent); box-shadow: 0 0 8px rgba(59,130,246,.8); }
.seek-range { appearance: none; -webkit-appearance: none; height: 4px; border-radius: 9999px; background: linear-gradient(to right, var(--primary-soft) var(--progress, 0%), var(--border) var(--progress, 0%)); cursor: pointer; width: 72px; }
.seek-range::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 9999px; background: var(--foreground); box-shadow: 0 0 0 3px rgba(124,58,237,.45); }
.seek-range:disabled { cursor: not-allowed; opacity: .4; }

/* ---------- Analysis ---------- */
.mode-btn { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 12px; border: 1px solid rgba(55,51,79,.8); background: rgba(16,16,30,.4); text-align: left; transition: border-color .2s, background .2s; }
.mode-btn:hover { border-color: rgba(167,139,250,.4); }
.mode-btn.active { border-color: rgba(167,139,250,.7); background: rgba(124,58,237,.15); }
.radio-dot { display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 9999px; border: 1px solid rgba(153,148,181,.6); flex-shrink: 0; }
.mode-btn.active .radio-dot { border-color: var(--primary-soft); background: var(--primary-soft); }
.mode-btn.active .radio-dot::after { content: ""; width: 6px; height: 6px; border-radius: 9999px; background: var(--background); }
.chip-live { border-radius: 9999px; padding: 2px 8px; font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; background: rgba(52,211,153,.1); color: var(--ok-text); }
.chip-captured { background: rgba(124,58,237,.2); color: var(--primary-soft); }
.moment { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 12px; border: 1px solid rgba(55,51,79,.7); background: rgba(16,16,30,.4); transition: border-color .2s; }
.moment:hover { border-color: rgba(167,139,250,.4); }
.moment.sel { border-color: rgba(167,139,250,.6); background: rgba(124,58,237,.15); }
.moment-main { display: flex; flex: 1; min-width: 0; align-items: flex-start; gap: 10px; padding: 4px 6px; border-radius: 8px; text-align: left; }
.num { display: flex; align-items: center; justify-content: center; height: 20px; min-width: 20px; padding: 0 4px; border-radius: 4px; background: var(--surface-raised); color: var(--muted); font: 10px ui-monospace, Menlo, monospace; margin-top: 2px; }
.moment.sel .num { background: var(--primary-soft); color: var(--background); }
.editor { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 12px; border: 1px solid rgba(167,139,250,.5); background: rgba(124,58,237,.1); }
.thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; list-style: none; margin: 0; }
.thumb { width: 128px; flex-shrink: 0; }
.thumb button, .frame-img button { display: block; width: 100%; overflow: hidden; border-radius: 8px; border: 1px solid var(--border); background: #000; box-shadow: 0 0 0 2px transparent; transition: box-shadow .2s; }
.thumb img, .frame-img img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: contain; }
.thumb.ref button:hover, .frame-img.ref button:hover { box-shadow: 0 0 0 2px rgba(167,139,250,.7); }
.thumb.cur button:hover, .frame-img.cur button:hover { box-shadow: 0 0 0 2px rgba(59,130,246,.7); }

/* ---------- Timeline + feedback ---------- */
.atl { display: flex; gap: 12px; }
.atl-labels { width: 104px; flex-shrink: 0; padding-top: 28px; }
@media (max-width: 640px) { .atl-labels { width: 76px; } }
.atl-label { display: flex; align-items: center; gap: 8px; height: 36px; font-size: 12px; color: var(--muted); }
.atl-ruler { position: relative; height: 20px; margin-bottom: 8px; font: 10px ui-monospace, Menlo, monospace; color: var(--muted); }
.atl-ruler span { position: absolute; top: 0; }
.atl-lanes { position: relative; border-radius: 8px; background: rgba(16,16,30,.4); cursor: pointer; }
.atl-lane { position: relative; height: 36px; border-bottom: 1px solid rgba(55,51,79,.3); }
.atl-lane:last-child { border-bottom: 0; }
.atl-lane::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(55,51,79,.6); }

function formatTime(ms, decimals = 2) {
  if (!Number.isFinite(ms) || ms < 0) ms = 0;
  const unit = decimals === 3 ? 1 : 10;
  const per = decimals === 3 ? 1000 : 100;
  const total = Math.round(ms / unit);
  const m = Math.floor(total / (60 * per));
  const s = Math.floor(total / per) % 60;
  const f = total % per;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${String(f).padStart(decimals, "0")}`;
}
function parseTime(text) {
  const parts = String(text).trim().split(":");
  if (parts.length > 2 || parts.some((p) => !/^\d+(\.\d+)?$/.test(p))) return null;
  if (parts.length === 2 && parts[0].includes(".")) return null;
  const sec = parts.length === 2 ? Number(parts[0]) * 60 + Number(parts[1]) : Number(parts[0]);
  return Math.round(sec * 1000);
}
const formatOffset = (ms) => `${ms >= 0 ? "+" : "−"}${(Math.abs(ms) / 1000).toFixed(2)}s`;
const formatSpan = (a, b) => `${formatTime(a)} – ${formatTime(b)}`;
const formatLength = (ms) => `${(ms / 1000).toFixed(2)}s`;
function formatFileSize(bytes) {
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
  if (bytes < 1024 * 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
  return `${(bytes / 1024 / 1024 / 1024).toFixed(2)} GB`;
}

  return new Date(iso).toLocaleDateString(locale, { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
}
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const x = [...b].map((v) => v.toString(16).padStart(2, "0")).join("");
  return `${x.slice(0, 8)}-${x.slice(8, 12)}-${x.slice(12, 16)}-${x.slice(16, 20)}-${x.slice(20)}`;
}

/** h("div", {class, onclick, ...}, ...children) — tiny DOM builder. Strings are always inserted as text. */
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else if (k === "value") el.value = v;
      else if (k === "checked" || k === "disabled" || k === "selected") el[k] = Boolean(v);
      else el.setAttribute(k, v === true ? "" : String(v));
    }
  }
  append(el, children);
  return el;
}

    if (Array.isArray(c)) append(el, c);

}

  const api = params.get("api") || fromHash.get("api");
  if (pairing) { config.pairing = pairing; store.set("framemind-standalone-pairing", pairing); }
  if (api && isLocalAddress(api)) { config.apiBase = api.replace(/\/+$/, ""); store.set("framemind-standalone-api", config.apiBase); }

          checks.length ? h("ul", { class: "clean grid-sm2 xs muted", style: { marginTop: "8px", gap: "6px" } }, checks.map(([label, ok]) => h("li", { class: "row" }, h("span", { class: "dot", style: { background: ok ? "var(--ok)" : "var(--warn)" } }), `${label}: ${ok ? B.ready : B.notSetUp}`))) : null)
      : h("div", { class: "notice n-err col", style: { gap: "6px" } }, h("span", { class: "row" }, icon("alert", 15), B.unreachable(config.apiBase)),
          h("span", null, `${B.startWith} `, h("code", null, "uvicorn app.main:app"), ` ${B.inside} `, h("code", null, "backend/"))),
    h("label", { class: "field" }, S.address, addr),
    h("label", { class: "field" }, S.pairing, code, h("span", { class: "xxs muted" }, S.pairingHint)),
    h("div", { class: "row wrap" }, button(S.save, { variant: "primary", iconName: "link", onClick: save }), button(S.retry, { variant: "ghost", iconName: "restart", onClick: async () => { await checkBackend(); renderPage(); } })),
    msg,
    store.ok ? null : h("p", { class: "notice n-warn", style: { margin: 0 } }, S.storageOff));
}
function renderSettings() {
  const T = t(), SE = T.settings;
  if (online() && !prov.status && !prov.loading) loadProviderDetails(false);
  els.provider = h("div", null, renderCodexSection());
  return [
    pageHeader(SE.title, SE.description),
    h("div", { "data-slot": "backend-banner" }, backendBanner()),
    h("div", { class: "grid2" },
      card(cardHeader(st().connTitle, st().connDesc), h("div", { class: "card-b" }, renderBackendSection())),
      card(cardHeader(T.ai.settingsTitle, T.ai.settingsDescription), h("div", { class: "card-b" }, els.provider)),
      card(cardHeader(SE.languageTitle, SE.languageDescription), h("div", { class: "card-b", style: { maxWidth: "20rem" } }, languageSwitcher(false)))),
    card(cardHeader(SE.aboutTitle, `FrameMind AI · ${st().file}`), h("p", { class: "sm muted card-b", style: { margin: 0 } }, st().aboutText)),
  ];
}

// ======================================================================================================
// Boot
// ======================================================================================================
window.addEventListener("hashchange", onRoute);
window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
window.addEventListener("online", () => checkBackend());
window.addEventListener("beforeunload", () => { for (const s of SLOTS) if (ws.sources[s] && ws.sources[s].kind === "file" && ws.players[s].url) URL.revokeObjectURL(ws.players[s].url); });
parseRoute();
renderApp();
checkBackend().then(() => {
  if (route.page === "analysis") {
    const id = route.params.get("session");
    if (id && id !== ws.session.id) restoreSession(id);
  }
});
setInterval(() => { if (document.visibilityState === "visible") checkBackend(); }, 15000);
</script>
